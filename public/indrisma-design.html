<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Indrisma — design mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #05060a;
    color: #f2f0ec;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .frame {
    width: 1180px;
    max-width: 100%;
    height: 700px;
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    background:
      radial-gradient(120% 90% at 20% 10%, rgba(120,150,140,.14), transparent 55%),
      radial-gradient(100% 80% at 85% 90%, rgba(90,70,50,.16), transparent 60%),
      linear-gradient(160deg, #0d1210 0%, #0a0b0d 45%, #08090b 100%);
    box-shadow: 0 40px 100px -20px rgba(0,0,0,.7);
    border: 1px solid rgba(255,255,255,.06);
  }
  .grain {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, transparent 40%, rgba(0,0,0,.55) 100%);
    pointer-events: none;
  }

  /* ---- top bar ---- */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 28px 36px 0;
    z-index: 5;
  }
  .clock { font-family: 'IBM Plex Mono', monospace; }
  .clock .time { font-size: 18px; font-weight: 500; letter-spacing: 0.12em; color: #f2f0ec; }
  .clock .date { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #676a6f; margin-top: 4px; }

  .wordmark {
    position: absolute; left: 50%; top: 26px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    text-align: center;
  }
  .breathe {
    width: 7px; height: 7px; border-radius: 50%;
    border: 1px solid #c9a876;
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: .5; }
    50% { transform: scale(1.9); opacity: 1; }
  }
  .wordmark-text { font-family: 'Fraunces', serif; font-weight: 300; font-size: 22px; letter-spacing: 0.14em; color: #f2f0ec; }

  .movies-btn {
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; cursor: pointer;
    color: #8b8d91; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    font-family: 'Inter', sans-serif;
    padding: 6px 0;
    transition: color .2s;
  }
  .movies-btn:hover { color: #c9a876; }

  /* ---- left rail ---- */
  .rail {
    position: absolute; left: 34px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: flex-start; gap: 22px;
    z-index: 5;
  }
  .rail-item { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .rail-icon {
    width: 17px; height: 17px; display: grid; place-items: center;
    color: #676a6f; transition: color .2s;
  }
  .rail-item.active .rail-icon { color: #c9a876; }
  .rail-item:hover .rail-icon { color: #f2f0ec; }
  .rail-label {
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #c9a876; opacity: 0; transform: translateX(-4px);
    transition: all .2s; white-space: nowrap;
  }
  .rail-item.active .rail-label { opacity: 1; transform: translateX(0); }
  .rail-line { width: 1px; height: 18px; background: rgba(255,255,255,.08); margin-left: 8px; }

  /* ---- player bar ---- */
  .player {
    position: absolute; left: 0; right: 0; bottom: 0;
    border-top: 1px solid rgba(255,255,255,.07);
    background: rgba(9,10,12,.72);
    backdrop-filter: blur(24px);
    padding: 18px 36px 14px;
    z-index: 5;
  }
  .player-row { display: flex; align-items: center; gap: 18px; }
  .art { width: 42px; height: 42px; border-radius: 4px; background: linear-gradient(135deg,#3a3f38,#1c1e1a); flex-shrink: 0; }
  .track-info { flex: 1; min-width: 0; }
  .track-title { font-size: 13px; font-weight: 500; color: #f2f0ec; }
  .track-sub { font-size: 11px; color: #676a6f; margin-top: 2px; }
  .scrub { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .scrub-time { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #4c4f54; }
  .scrub-track { flex: 1; height: 1px; background: rgba(255,255,255,.12); position: relative; }
  .scrub-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 34%; background: #c9a876; }
  .scrub-fill::after { content: ''; position: absolute; right: -3px; top: 50%; transform: translateY(-50%); width: 7px; height: 7px; border-radius: 50%; background: #c9a876; }

  .transport { display: flex; align-items: center; gap: 22px; flex-shrink: 0; }
  .transport button { background: none; border: none; color: #8b8d91; cursor: pointer; padding: 0; transition: color .2s; }
  .transport button:hover { color: #f2f0ec; }
  .play-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid #f2f0ec; display: grid; place-items: center;
  }

  .vol { display: flex; align-items: center; gap: 8px; flex-shrink: 0; color: #676a6f; }
  .vol-track { width: 60px; height: 1px; background: rgba(255,255,255,.14); position: relative; }
  .vol-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 70%; background: #676a6f; }

  .channels {
    display: flex; gap: 22px; margin-top: 16px; padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.05);
  }
  .channel {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #55575c; padding-bottom: 6px; cursor: pointer; border-bottom: 1px solid transparent;
    transition: color .2s;
  }
  .channel.active { color: #f2f0ec; border-bottom-color: #c9a876; }

  /* ---- movie panel ---- */
  .panel {
    position: absolute; right: 16px; top: 16px; bottom: 16px; width: 300px;
    background: rgba(11,12,15,.88);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 10px;
    z-index: 8;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel-tabs {
    display: flex; gap: 18px; padding: 18px 20px 14px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .panel-tab { font-size: 11.5px; color: #55575c; cursor: pointer; padding-bottom: 4px; border-bottom: 1px solid transparent; }
  .panel-tab.active { color: #f2f0ec; border-bottom-color: #c9a876; }
  .panel-search {
    margin: 14px 20px 6px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,.08); padding-bottom: 8px;
  }
  .panel-search input { background: none; border: none; outline: none; color: #f2f0ec; font-size: 12px; width: 100%; font-family: 'Inter', sans-serif; }
  .panel-search input::placeholder { color: #4c4f54; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 20px; overflow: hidden; }
  .poster { aspect-ratio: 2/3; border-radius: 5px; background: linear-gradient(150deg,#2a2d28,#15170f); position: relative; }
  .poster span { position: absolute; bottom: 6px; left: 6px; right: 6px; font-size: 9px; color: #d8d5cd; }

  svg { display: block; }
</style>
</head>
<body>
  <div class="frame">
    <div class="grain"></div>

    <div class="topbar">
      <div class="clock">
        <div class="time">17:53</div>
        <div class="date">Sat 15 Aug 2026</div>
      </div>
      <button class="movies-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>
        Watchlist
      </button>
    </div>

    <div class="wordmark">
      <span class="breathe"></span>
      <span class="wordmark-text">INDRISMA</span>
    </div>

    <div class="rail">
      <div class="rail-item active">
        <span class="rail-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0 4 3 6 0"/></svg></span>
        <span class="rail-label">River</span>
      </div>
      <div class="rail-item">
        <span class="rail-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/></svg></span>
      </div>
      <div class="rail-item">
        <span class="rail-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20l6-14 4 8 3-5 3 11"/></svg></span>
      </div>
      <div class="rail-item">
        <span class="rail-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 18l5-10 4 6 3-5 6 9"/></svg></span>
      </div>
      <div class="rail-item">
        <span class="rail-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg></span>
      </div>
      <div class="rail-line"></div>
      <div class="rail-item">
        <span class="rail-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 8.5l-6.2 3.8L22 16V8.5zM2 6h13v12H2z"/></svg></span>
      </div>
      <div class="rail-item">
        <span class="rail-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 16l4-4 4 4 6-6"/></svg></span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-tabs">
        <span class="panel-tab active">Search</span>
        <span class="panel-tab">Watchlist</span>
        <span class="panel-tab">Watched</span>
      </div>
      <div class="panel-search">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4c4f54" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input placeholder="Search films, series…" />
      </div>
      <div class="grid">
        <div class="poster"><span>Arrival</span></div>
        <div class="poster"><span>Drive</span></div>
        <div class="poster"><span>Her</span></div>
        <div class="poster"><span>Paris, Tx</span></div>
        <div class="poster"><span>Roma</span></div>
        <div class="poster"><span>Ikiru</span></div>
      </div>
    </div>

    <div class="player">
      <div class="player-row">
        <div class="art"></div>
        <div class="track-info">
          <div class="track-title">Kaifi Kaifi</div>
          <div class="track-sub">Indian Bus Driver</div>
          <div class="scrub">
            <span class="scrub-time">1:24</span>
            <div class="scrub-track"><div class="scrub-fill"></div></div>
            <span class="scrub-time">4:02</span>
          </div>
        </div>
        <div class="transport">
          <button><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg></button>
          <div class="play-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="#f2f0ec"><path d="M8 5v14l11-7z"/></svg></div>
          <button><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg></button>
        </div>
        <div class="vol">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 8a5 5 0 010 8"/></svg>
          <div class="vol-track"><div class="vol-fill"></div></div>
        </div>
      </div>
      <div class="channels">
        <span class="channel active">Indian Bus Driver</span>
        <span class="channel">Alka Nostalgia</span>
        <span class="channel">Bhojpuri Hits</span>
        <span class="channel">Remix</span>
        <span class="channel">Global Pop</span>
        <span class="channel">Lo-Fi Beats</span>
      </div>
    </div>
  </div>
</body>
</html>
